# macOS: clang_bootstrap; Windows: keep consistent with llvmdev and clangdev
c_compiler:
  - clang_bootstrap     # [osx]
  - vs2022              # [win]
cxx_compiler:
  - clang_bootstrap     # [osx]
  - vs2022              # [win]

# Build with clang 23 compiler (clang_bootstrap 23.1.4 from clang-compiler-activation)
c_compiler_version:
  - 23.1.4           # [osx]
cxx_compiler_version:
  - 23.1.4           # [osx]

libxml2:
  - 2.15.3
